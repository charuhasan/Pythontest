name: Docker SBOM Scan and Insights

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'app.py'
      - '.github/workflows/sbom-scan.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'app.py'

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: python-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-docker-image'

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: python-app:${{ github.sha }}
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Generate SBOM CycloneDX format
        uses: anchore/sbom-action@v0
        with:
          image: python-app:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM to GitHub Dependency Graph
        uses: anchore/sbom-action/publish-sbom@v0
        with:
          sbom-artifact-upload: true
          sbom-artifact-match: 'sbom-*.json'

      - name: Submit SBOM to GitHub Dependency Graph
        uses: github/dependency-submission-action@v4
        if: github.event_name == 'push'
        with:
          sbom-file: sbom-spdx.json

