name: Docker SBOM Scan and Insights

on:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'app.py'
      - '.github/workflows/sbom-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'app.py'

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      packages: read
      id-token: write # Required for some security uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true # This makes the image available to Trivy/Syft locally
          tags: python-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0 # Use a fixed version for stability
        with:
          image-ref: python-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-docker-image'

      # Combined SBOM generation and upload
      - name: Generate and Upload SBOM
        uses: anchore/sbom-action@v0
        with:
          image: python-app:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          dependency-snapshot: true # This replaces the need for the separate submission action
